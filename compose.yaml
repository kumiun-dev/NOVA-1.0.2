services:
  nova:
    image: ${NOVA_IMAGE:-local/nova:customer}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      NOVA_DEPLOYMENT_MODE: selfhost
      NOVA_SECURE_COOKIES: "true"
      NOVA_PUBLIC_URL: https://${NOVA_DOMAIN}
    volumes:
      - nova_data:/app/data
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  nova_data:
